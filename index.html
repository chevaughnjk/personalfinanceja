<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F6CBD" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Private, on-device personal finance analyser. Your statement data never leaves your device."
    />
    <title>Personal Finance Analyser</title>
    <link rel="manifest" href="./interface/manifest.json" />
    <link rel="apple-touch-icon" href="./interface/icons/apple-touch-icon.png" />
    <link rel="icon" href="./interface/icons/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="./interface/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <link rel="stylesheet" href="./interface/styles.css" />
    <link rel="stylesheet" href="./interface/glass.css" />
    <link rel="stylesheet" href="./interface/treemap.css" />
    <link rel="stylesheet" href="./interface/income-chart.css" />
    <link rel="stylesheet" href="./interface/flow-chart.css" />
    <link rel="modulepreload" href="./application/app.js" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <!-- Print-only report (built on demand, hidden on screen) -->
    <div id="print-report" class="print-only" aria-hidden="true"></div>

    <div class="topbar-stack">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2.5" y="5" width="19" height="14" rx="2.5" />
              <path d="M2.5 9.5h19" />
            </svg>
          </span>
          <h1 class="brand-name" id="brand-name">Personal Finance Analyser</h1>
        </div>

        <div class="top-actions">
          <label id="add-btn" class="btn primary file-trigger" aria-label="Add statement">
            <span class="btn-ic" aria-hidden="true"
              ><svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 5v14M5 12h14" /></svg
            ></span>
            <span class="btn-label">Add statement</span>
            <input
              id="add-input"
              class="file-trigger-input"
              type="file"
              accept="application/pdf"
              multiple
            />
          </label>

          <button id="folder-btn" class="btn" hidden>
            <span class="btn-ic" aria-hidden="true"
              ><svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                /></svg
            ></span>
            <span class="btn-label">Watch folder</span>
          </button>

          <div class="menu-wrap">
            <button
              id="export-btn"
              class="btn"
              aria-haspopup="true"
              aria-expanded="false"
              aria-label="Export"
            >
              <span class="btn-ic nav-ic" aria-hidden="true"
                ><svg
                  viewBox="0 0 24 24"
                  width="16"
                  height="16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 15V3M8 7l4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" /></svg
              ></span>
              <span class="btn-label">Export</span>
              <span class="caret" aria-hidden="true"
                ><svg
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M6 9l6 6 6-6" /></svg
              ></span>
            </button>
            <div id="export-menu" class="menu" hidden>
              <div class="menu-label">Export</div>
              <button id="exp-csv" class="menu-item">
                <span class="menu-ic" aria-hidden="true"
                  ><svg
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M12 15V3M8 7l4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" /></svg
                ></span>
                <span>Export transactions (CSV)&hellip;</span>
              </button>
              <button id="exp-print" class="menu-item">
                <span class="menu-ic" aria-hidden="true"
                  ><svg
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="6" y="9" width="12" height="7" rx="1" />
                    <path d="M6 9V4h12v5M8 16v4h8v-4" /></svg
                ></span>
                <span>Print / Save as PDF</span>
              </button>
              <div class="menu-sep"></div>
              <div class="menu-label">Category rules</div>
              <button id="exp-rules-export" class="menu-item">
                <span class="menu-ic" aria-hidden="true"
                  ><svg
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg
                ></span>
                <span>Export rules</span>
              </button>
              <label id="exp-rules-import" class="menu-item file-trigger file-menu-item">
                <span class="menu-ic" aria-hidden="true"
                  ><svg
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <path d="M14 2v6h6" /></svg
                ></span>
                <span>Import rules</span>
                <input
                  id="exp-rules-input"
                  class="file-trigger-input"
                  type="file"
                  accept=".json,application/json"
                />
              </label>
              <div class="menu-sep"></div>
              <div class="menu-label">Backup</div>
              <button id="exp-export" class="menu-item">
                <span class="menu-ic" aria-hidden="true"
                  ><svg
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="5" y="11" width="14" height="9" rx="2" />
                    <path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg
                ></span>
                <span>Export encrypted history</span>
              </button>
              <label id="exp-import" class="menu-item file-trigger file-menu-item">
                <span class="menu-ic" aria-hidden="true"
                  ><svg
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <path d="M14 2v6h6" /></svg
                ></span>
                <span>Import encrypted history</span>
                <input
                  id="exp-import-input"
                  class="file-trigger-input"
                  type="file"
                  accept=".ccah,application/octet-stream,application/json"
                />
              </label>
            </div>
          </div>

          <button id="theme-btn" class="btn icon-btn" title="Theme: Auto" aria-label="Theme: Auto">
            <span class="btn-ic nav-ic" aria-hidden="true"
              ><svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" /></svg
            ></span>
            <span class="btn-label" id="theme-label">Auto</span>
          </button>
        </div>
      </header>

      <div id="period-bar" class="period-bar"></div>
    </div>

    <noscript>
      <p
        style="
          max-width: 460px;
          margin: 40px auto;
          text-align: center;
          font-family: system-ui, sans-serif;
        "
      >
        This analyser runs entirely in your browser and needs JavaScript to read your statements on
        this device. Please enable JavaScript, then reload.
      </p>
    </noscript>

    <main id="app" class="wrap" tabindex="-1">
      <div class="app-loading" role="status" aria-live="polite">
        <span class="spin" aria-hidden="true"></span>
        <span class="muted">Reading your data&hellip;</span>
      </div>
    </main>

    <footer id="footer" class="footer">
      Your history stays on this device. Nothing leaves it.
    </footer>

    <!-- Overlays -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="busy" class="busy" aria-hidden="true">
      <div class="busy-card">
        <span class="busy-spin" aria-hidden="true"></span>
        <span class="busy-msg">Working&hellip;</span>
      </div>
    </div>

    <button id="to-top" class="to-top" type="button" aria-label="Back to top" hidden>
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 19V5M5 12l7-7 7 7" />
      </svg>
    </button>

    <script>
      (function () {
        var STARTUP_TIMEOUT_MS = 12000;
        var boot = { started: false, shown: false, timer: null };

        function renderStartupError() {
          if (boot.shown) return;
          boot.shown = true;
          var app = document.getElementById('app');
          if (!app) return;
          app.innerHTML =
            '<section class="card empty">' +
            '<div class="empty-icon"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div>' +
            '<h2>The app could not start</h2>' +
            '<div class="empty-lines">' +
            '<p class="muted">Something the app needs did not load. This is usually temporary.</p>' +
            '<p class="muted">Nothing saved on this device has changed.</p>' +
            '</div>' +
            '<button class="btn primary lg" type="button" onclick="location.reload()">Reload</button>' +
            '</section>';
        }

        function markStarted() {
          boot.started = true;
          if (boot.timer) {
            clearTimeout(boot.timer);
            boot.timer = null;
          }
        }

        function reportFailure() {
          if (boot.started) return;
          renderStartupError();
        }

        window.__pfaBoot = {
          markStarted: markStarted,
          reportFailure: reportFailure,
        };

        window.addEventListener(
          'error',
          function (e) {
            if (boot.started) return;
            var target = e && e.target;
            if (target && target !== window && target.tagName) {
              if (target.tagName === 'SCRIPT') reportFailure();
              return;
            }
            reportFailure();
          },
          true
        );

        window.addEventListener('unhandledrejection', function () {
          reportFailure();
        });

        boot.timer = setTimeout(reportFailure, STARTUP_TIMEOUT_MS);
      })();
    </script>
    <script type="module">
      if (['localhost', '127.0.0.1', '::1', '0.0.0.0'].includes(location.hostname)) {
        import('./application/sample-data/mock-personas.js').catch((e) =>
          console.warn('Sample-data tool not loaded:', e)
        );
      }
    </script>
    <script type="module" src="./application/app.js"></script>
  </body>
</html>
