name: Update exchange rates

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and write JMD/USD rate
        run: |
          set -euo pipefail
          RESP=$(curl -fsS "https://open.er-api.com/v6/latest/USD")
          RATE=$(printf '%s' "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['rates']['JMD'])")
          DATE=$(date -u +%F)
          OK=$(python3 -c "r=float('$RATE');print('yes' if 100.0 <= r <= 250.0 else 'no')")
          if [ "$OK" != "yes" ]; then
            echo "Rate $RATE outside sanity bounds; keeping last good rate."
            exit 0
          fi
          python3 - "$RATE" "$DATE" <<'PY'
          import json, sys
          rate = round(float(sys.argv[1]), 2)
          date = sys.argv[2]
          out = {"base": "JMD", "rates": {"USD": rate}, "asOf": date, "source": "open.er-api.com"}
          with open("settings/exchange-rates.json", "w") as f:
              f.write(json.dumps(out, indent=2) + "\n")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- settings/exchange-rates.json; then
            echo "No rate change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add settings/exchange-rates.json
          git commit -m "Update JMD/USD exchange rate ($(date -u +%F))"
          git push
